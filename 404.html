<!doctype html>
<html lang="ru" class="no-js">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>404 — страница ушла за пивом · Скуф и сыновья</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#16120E" />
<!-- GitHub Pages отдаёт эту страницу по любому адресу, поэтому пути — от корня проекта -->
<base href="/skuf-i-synovya/" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/crt.css?v=202611201353" />
<link rel="stylesheet" href="css/main.css?v=202611201353" />
<script>
  (function () {
    var root = document.documentElement
    root.classList.remove("no-js"); root.classList.add("js")
    try { if (localStorage.getItem("skuf-nostalgia") === "0") root.classList.add("no-nostalgia") } catch (e) {}
    if (!root.classList.contains("no-nostalgia")) root.classList.add("crt-on", "crt-boot")
    setTimeout(function () { root.classList.remove("crt-boot") }, 3000)
  })()
</script>
<script type="module" src="js/crt.js?v=202611201353"></script>
<style>
  .e404 { min-height: 100dvh; display: grid; align-content: center; justify-items: start; gap: var(--s-3); padding-block: var(--s-10); }
  .e404__code { font-family: var(--f-display); font-weight: 900; font-size: clamp(7rem, 30vw, 20rem); line-height: 0.8; letter-spacing: -0.07em; color: transparent; -webkit-text-stroke: 2px var(--c-amber); }
  .e404__title { font-family: var(--f-display); font-weight: 900; font-size: var(--fs-2xl); line-height: var(--lh-head); letter-spacing: var(--tr-display); max-width: 20ch; text-wrap: balance; }
  .e404__text { color: var(--c-muted); font-size: var(--fs-md); max-width: 46ch; }
  .e404 .btn { margin-top: var(--s-2); }
  html.crt-on .e404 { min-height: calc(100dvh - var(--crt-t, 0px) - var(--crt-b, 0px)); padding-block: var(--s-6); gap: var(--s-2); }
  html.crt-on .e404__code { font-size: clamp(6rem, 22vw, 15rem); }
</style>
</head>
<body>
<main class="container e404">
  <a class="logo" href="./" aria-label="Скуф и сыновья — на главную">
    <svg class="logo__mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h10v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V8Z"/><path d="M15 10h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M5 8c0-2 1.4-3.5 3-3.5.6-1.4 3.4-1.6 4.3 0C14 4.6 15 6 15 8"/><path d="M9 12v5M12 12v5"/></svg>
    <span class="logo__word">Скуф <em>и сыновья</em></span>
  </a>
  <p class="e404__code" aria-hidden="true">404</p>
  <h1 class="e404__title">Страница ушла за пивом и не вернулась. Как батя в 2007-м.</h1>
  <p class="e404__text mono">All your бороды are belong to us.</p>
  <a class="btn btn--amber" href="./">Вернуться на главную</a>
</main>
<script>
  // Пасхалка «Страница 404» засчитывается в счётчик на главной
  try {
    var found = JSON.parse(localStorage.getItem("skuf-eggs") || "[]")
    if (found.indexOf("404") < 0) { found.push("404"); localStorage.setItem("skuf-eggs", JSON.stringify(found)) }
  } catch (e) {}
</script>

<!-- ============ ТЕЛЕВИЗОР «СКУФТРОН»: отдельный fixed-слой поверх страницы (css/crt.css, js/crt.js) ============ -->
<div class="crt" id="crt" data-osd="CH ?? · НЕТ СИГНАЛА">
  <div class="crt__screen" aria-hidden="true">
    <div class="crt__lines"></div>
    <p class="crt__osd" aria-hidden="true"></p>
    <div class="crt__power"><i></i><i></i><span class="crt__beam"></span></div>
  </div>
  <button class="crt__off-msg" type="button" aria-label="Включить телевизор">Батя смотрит футбол. Нажми, чтобы вернуть сайт</button>
  <div class="crt__case" aria-hidden="true"></div>
  <div class="crt__rim" aria-hidden="true"></div>
  <div class="crt__panel">
    <div class="crt__left" aria-hidden="true"><span class="crt__grille"></span><span class="crt__sticker">Не ставить пиво на телевизор</span></div>
    <div class="crt__brand" aria-hidden="true"><span class="crt__logo">СКУФТРОН</span><span class="crt__model">21″ · Trinitron не завезли</span></div>
    <div class="crt__right">
      <nav class="crt__ch" aria-label="Каналы телевизора">
        <button class="crt__btn" type="button" data-ch="#prices" title="01 Прайс">CH1</button>
        <button class="crt__btn" type="button" data-ch="#gold" title="02 Пузо Карт">CH2</button>
        <button class="crt__btn" type="button" data-ch="#team" title="03 Бати">CH3</button>
        <button class="crt__btn" type="button" data-ch="#faq" title="04 Вопросы">CH4</button>
        <button class="crt__btn" type="button" data-ch="#guestbook" title="05 Гостевая">CH5</button>
        <button class="crt__btn" type="button" data-ch="#contacts" title="06 Контакты">CH6</button>
      </nav>
      <div class="crt__vol"><button class="crt__btn" type="button" data-vol aria-label="Громкость тише">VOL −</button><button class="crt__btn" type="button" data-vol aria-label="Громкость громче">VOL +</button><span class="crt__tip" role="status">Громкость регулирует батя</span></div>
      <span class="crt__led" aria-hidden="true"></span>
      <button class="crt__power-btn" type="button" aria-label="Питание телевизора"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
